# Weekly version-update pull requests for every pinned dependency manifest. Security
# updates are raised as soon as an advisory is published (repository setting).
version: 2
updates:
  - package-ecosystem: pip
    directories:
      - "/"
      - "/lambdas/authorizer"
      - "/lambdas/ingest"
      - "/lambdas/read"
      - "/lambdas/writer"
    schedule:
      interval: weekly
    # Wait a week before proposing a new release (malicious or broken publishes).
    cooldown:
      default-days: 7
    groups:
      aws-sdk:
        patterns: ["boto3", "botocore"]
  - package-ecosystem: npm
    directories:
      - "/lambdas/fetch"
      - "/assets/acxd"
    schedule:
      interval: weekly
    # Wait a week before proposing a new release (malicious or broken publishes).
    cooldown:
      default-days: 7
    groups:
      aws-sdk-js:
        patterns: ["@aws-sdk/*"]
    # Stay on the major versions the sample targets: @types/node follows the Node.js 22
    # Lambda runtime, and the ACXD asset scripts are typechecked with TypeScript 5.
    ignore:
      - dependency-name: "@types/node"
        versions: [">=23.0.0"]
      - dependency-name: "typescript"
        versions: [">=6.0.0"]
